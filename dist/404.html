<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Sayfa Bulunamadı | Taş Fırın Lovemacun</title>
  <style>
    body {
      background: #0f0805;
      color: #faf5ee;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      max-width: 480px;
      background: #180d08;
      border: 1px solid rgba(255, 120, 40, 0.2);
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .emoji { font-size: 54px; margin-bottom: 12px; display: inline-block; }
    h1 { font-size: 26px; color: #ff6b00; margin: 12px 0 8px; }
    p { color: #d0c2b5; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff6b00, #ff8800);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍕</div>
    <h1>Aradığınız Lezzet Bulunamadı</h1>
    <p>Ulaşmaya çalıştığınız sayfa mevcut değil veya taşınmış olabilir. Menümüze göz atabilirsiniz.</p>
    <a href="/">Taş Fırın Lovemacun Menüye Dön</a>
  </div>
</body>
</html>
